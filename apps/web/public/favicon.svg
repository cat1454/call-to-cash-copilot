<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945ff" />
      <stop offset="100%" stop-color="#14f195" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="12" filter="url(#glow)" />
  <g transform="translate(146, 146) scale(1.4)">
    <!-- Bus Icon -->
    <rect x="25" y="40" width="110" height="90" rx="15" fill="#9945ff" />
    <rect x="35" y="50" width="90" height="35" rx="5" fill="#14f195" />
    <!-- Bus Windows -->
    <rect x="42" y="55" width="22" height="20" rx="2" fill="#06080e" />
    <rect x="70" y="55" width="22" height="20" rx="2" fill="#06080e" />
    <rect x="98" y="55" width="22" height="20" rx="2" fill="#06080e" />
    <!-- Bus Headlights -->
    <circle cx="45" cy="115" r="8" fill="#14f195" />
    <circle cx="115" cy="115" r="8" fill="#14f195" />
    <!-- Bus Grille -->
    <rect x="65" y="112" width="30" height="6" rx="2" fill="#333" />
    <!-- Bus Wheels -->
    <circle cx="45" cy="135" r="12" fill="#111" />
    <circle cx="115" cy="135" r="12" fill="#111" />
    <circle cx="45" cy="135" r="5" fill="#888" />
    <circle cx="115" cy="135" r="5" fill="#888" />
  </g>
</svg>